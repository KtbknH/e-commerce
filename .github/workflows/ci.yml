name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend-validate:
    name: "Backend: Validate"
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Check formatting
        run: mvn spotless:check -B
      
      - name: Google styls
        run: mvn spotless:apply -B
      - name: Compile
        run: mvn clean compile -B -DskipTests

  backend-unit-tests:
    name: "Backend: Unit Tests"
    runs-on: ubuntu-latest
    needs: [backend-validate]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Run unit tests
        run: mvn test -B -Dtest="!*IntegrationTest,!*IT"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7

  backend-integration-tests:
    name: "Backend: Integration Tests"
    runs-on: ubuntu-latest
    needs: [backend-unit-tests]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: database
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Run integration tests
        run: mvn verify -B -Dskip.unit.tests=true
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/database
          SPRING_DATASOURCE_USERNAME: username
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ci-test-secret-key-minimum-32-characters

  backend-build:
    name: "Backend: Build JAR"
    runs-on: ubuntu-latest
    needs: [backend-unit-tests]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Package
        run: mvn package -B -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: yoteh-backend-jar
          path: backend/target/*.jar
          retention-days: 14


  frontend-validate:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Check formatting
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx}" --ignore-unknown || true

  frontend-tests:
    name: "Frontend: Tests"
    runs-on: ubuntu-latest
    needs: [frontend-validate]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --passWithNoTests

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Export bundle
        run: npx expo export --platform web || echo "Build placeholder"


  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [backend-build, backend-integration-tests, frontend-build]
    if: |
      github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore: release')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Get version
        id: version
        run: echo "version=$(mvn -f backend/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
      - name: Build backend JAR
        run: mvn -f backend/pom.xml package -B -DskipTests
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: e-Commerce v${{ steps.version.outputs.version }}
          files: backend/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
