server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: yoteh-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yoteh_db}
    username: ${DB_USER:yoteh_user}
    password: ${DB_PASSWORD:yoteh_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
    
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    cache-duration: 3600
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    check-template-location: true
    

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    smtp:
      auth: true
      starttls: true
    debug: false
    from: ${MAIL_FROM:noreply@yoteh.com}
    from-name: ${MAIL_FROM_NAME:Yoteh}

        
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: 25MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# ─── Application Yoteh ─────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:yoteh-secret-key-change-in-production-min-32-chars}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    allowed-extensions: jpg,jpeg,png,gif,webp
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
  base-url: ${BASE_URL:http://localhost:8080}
  name: ${APP_NAME:Yoteh}
yoteh:
  default-currency: XOF
  supported-currencies: XOF,CDF,USD,EUR
  default-locale: fr

# ─── Swagger ───────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ─── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ─── Logging ───────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.yoteh: DEBUG
    org.hibernate.SQL: WARN
