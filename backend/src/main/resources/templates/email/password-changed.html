<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${appName} + ' — Mot de passe modifié'">Yoteh — Mot de passe modifié</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, Helvetica, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; }
        .header { background-color: #FF6B00; padding: 24px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 28px; }
        .content { padding: 32px 24px; color: #333333; line-height: 1.6; }
        .content h2 { color: #1A1A1A; margin-top: 0; }
        .warning { background-color: #FFF3CD; border: 1px solid #FFD700; border-radius: 6px;
                   padding: 12px 16px; margin: 16px 0; font-size: 14px; color: #856404; }
        .footer { background-color: #1A1A1A; padding: 20px 24px; text-align: center; color: #999999; font-size: 12px; }
        .footer a { color: #FF6B00; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${appName}">Yoteh</h1>
        </div>

        <div class="content">
            <h2>Mot de passe modifié</h2>

            <p>Bonjour <strong th:text="${firstName}">Client</strong>,</p>

            <p>
                Votre mot de passe a été modifié avec succès.
            </p>

            <div class="warning">
                Si vous n'êtes pas à l'origine de cette modification, contactez immédiatement
                notre équipe support à <strong>support@yoteh.com</strong>.
            </div>

            <p>Cordialement,<br/>L'équipe <span th:text="${appName}">Yoteh</span></p>
        </div>

        <div class="footer">
            <p>&copy; 2026 <span th:text="${appName}">Yoteh</span>. Tous droits réservés.</p>
        </div>
    </div>
</body>
</html>
