version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: yoteh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoteh_db
      POSTGRES_USER: yoteh_user
      POSTGRES_PASSWORD: yoteh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoteh_user -d yoteh_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
